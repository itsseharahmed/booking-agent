[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optometry-booking-api"
version = "0.1.0"
description = "Multi-location optometry booking API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",            #handles HTTP request
    "uvicorn[standard]>=0.30,<1",   #runs API server
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",                #runs tests
    "httpx>=0.27,<1",               #supports API testing
    "ruff>=0.9",                    #check code quality and types
    "mypy>=1.14",                   #same as ruff
    "sqlalchemy>=2.0,<3",           #db access and session management
    "psycopg[binary]>=3.2,<4",      #PostgreSQL driver used by SQLAlchemy
    "python-dotenv>=1.0,<2",
    "alembic>=1.14,<2",             #migration tool for SQLAlchemy
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

